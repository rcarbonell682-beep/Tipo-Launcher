name: build-apk

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Licencias y SDK de Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Se firma con keystore/debug.keystore (incluido en el repo), así cada APK
      # nuevo se instala encima del anterior sin desinstalar.
      - name: Compilar APK release
        run: gradle --no-daemon assembleRelease

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk Tipo-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tipo-launcher-apk
          path: Tipo-launcher.apk

      # Si subes una etiqueta que empiece por "v" (por ejemplo v1.0.0),
      # el APK se publica en la sección Releases del repositorio.
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Tipo-launcher.apk
          generate_release_notes: true
